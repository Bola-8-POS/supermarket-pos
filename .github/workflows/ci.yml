name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality:
    name: Typecheck / Lint / Test / Audit
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Isolate npm cache from interactive user npm-cache
        # `runner` context isn't valid in a job-level `env:` block (GH Actions
        # context-availability rule — only step-level env/run/with can read it),
        # so set NPM_CONFIG_CACHE here via $GITHUB_ENV instead. Reason for the
        # isolation itself: this runner's CI and interactive-user npm share the
        # same Windows account — actions/setup-node's cache-save step was hanging
        # on `tar: Permission denied` against npm-cache/_logs/*.log files locked
        # by concurrently-running interactive node/npm processes on this box.
        shell: pwsh
        run: "'NPM_CONFIG_CACHE={0}\\npm-cache' -f $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # --force: @storybook/addon-vitest@10.3.5's peerDependency on vitest
        # is "^3.0.0 || ^4.0.0" and does not yet support vitest 5 — an
        # accepted tradeoff (see 2602972) to clear npm audit's 5 critical
        # Storybook-browser-testing-chain findings. This only affects
        # test:storybook (RUN_STORYBOOK_TESTS-gated), never this job's own
        # `npm run test`.
        run: npm ci --force

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno unit tests (edge functions' _shared helpers)
        run: npm run test:deno

      - name: Security audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

  tauri-build:
    name: Tauri Native Build (Windows)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Isolate npm cache from interactive user npm-cache
        # See the `quality` job's identical step for why this is set here instead
        # of a job-level `env:` block.
        shell: pwsh
        run: "'NPM_CONFIG_CACHE={0}\\npm-cache' -f $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Prefer Git Bash over the WSL bash.exe stub
        # dtolnay/rust-toolchain's internal script needs a real /bin/bash. On this
        # runner, C:\Windows\System32 (containing the WSL launcher stub bash.exe)
        # comes before Git's bin dir on PATH, and the default WSL distro here
        # (docker-desktop) has no usable /bin/bash — that combination fails with
        # "execvpe(/bin/bash) failed: No such file or directory". Prepending Git's
        # real bash.exe to PATH via GITHUB_PATH fixes resolution for every later
        # step in this job.
        shell: pwsh
        run: echo 'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        # --force: @storybook/addon-vitest@10.3.5's peerDependency on vitest
        # is "^3.0.0 || ^4.0.0" and does not yet support vitest 5 — an
        # accepted tradeoff (see 2602972) to clear npm audit's 5 critical
        # Storybook-browser-testing-chain findings. This only affects
        # test:storybook (RUN_STORYBOOK_TESTS-gated), never this job's own
        # `npm run test`.
        run: npm ci --force

      - name: Build broker
        working-directory: broker
        run: cargo build --release

      - name: Broker unit tests
        working-directory: broker
        run: cargo test

      - name: generate build cert (Phase 20, DEP-01)
        # tauri.conf.json's bundle.resources unconditionally references
        # cert/selfsigned.cer, and build.rs checks that file exists at
        # *compile* time — before `--no-bundle` or any packaging flag is even
        # read. Every cargo invocation touching src-tauri (cargo test, cargo
        # build, tauri build) needs it on disk first, matching release.yml's
        # identical step for the same reason.
        shell: pwsh
        run: powershell -File scripts/generate-build-cert.ps1

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Tauri native build
        run: npm run tauri build -- --ci --no-bundle

      - name: Scan dist for provider-key patterns
        # This job's other run: steps default to pwsh on this self-hosted
        # Windows runner; a bare grep needs bash. This job's build sets no
        # VITE_* secrets, so this mostly proves the pattern doesn't
        # false-positive — release.yml's identical step, after the build that
        # actually materializes real VITE_* secrets, is the one that matters.
        shell: bash
        run: |
          test -d dist || exit 1
          if grep -rEl "sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|VITE_OPENAI_API_KEY" dist/; then exit 1; fi
